<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxelCraft</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}#game{width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:1px 1px 2px #000}.hidden{display:none!important}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px}#info{position:absolute;left:12px;top:10px;font-size:13px;line-height:1.45;max-width:560px}#hotbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:3px}.slot{width:54px;height:54px;border:2px solid #555;background:#222c;box-sizing:border-box;text-align:center;padding-top:3px;font-size:11px}.slot.sel{border-color:#fff}.swatch{width:36px;height:30px;margin:auto auto 2px;border:1px solid #111;background-size:36px 36px;background-position:center;background-repeat:no-repeat;image-rendering:pixelated}
#menu{position:fixed;inset:0;background:#000b;color:#fff;display:flex;align-items:center;justify-content:center;z-index:5}.panel{background:#202020;padding:22px;min-width:300px;max-width:90vw}button,input{font:inherit;padding:8px;margin:4px}button{cursor:pointer}#saveStatus{font-size:12px;color:#bbb}
</style></head><body>
<canvas id="game"></canvas><div id="hud"><div id="info">Click to play · WASD move · Space jump · LMB break · RMB place · 1-9 select · Esc unlock</div><div id="cross">+</div><div id="hotbar"></div></div>
<div id="menu"><div class="panel"><h2>VoxelCraft</h2><p>Modular voxel sandbox.</p><input id="worldName" value="My World" maxlength="32"><input id="seed" type="number" placeholder="Seed (random if blank)"><br><button id="newWorld">New World</button><button id="loadWorld">Load World</button><button id="exportWorld">Export Save</button><input id="importWorld" type="file" accept=".json,application/json" style="display:none"><button id="importButton">Import Save</button><div id="saveStatus">IndexedDB autosave enabled.</div><div style="font-size:12px;color:#9bb">6 chunks normal · 3 chunks underwater</div></div></div>
<script type="module" src="./src/main.js"></script></body></html>
